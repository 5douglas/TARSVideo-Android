name: Build TARSVideo Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-tarsvideo.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout TARSVideo overlay
        uses: actions/checkout@v4

      - name: Checkout Jellyfin Android
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-android
          ref: master
          path: upstream

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Apply TARSVideo + embedded LibVLC patch
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected pattern not found in {path}: {old[:80]!r}")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              "app/src/main/res/values/strings_donottranslate.xml",
              '<string name="app_name" translatable="false">Jellyfin</string>',
              '<string name="app_name" translatable="false">TARSVideo</string>',
          )

          replace_once(
              "app/src/main/res/values/strings_donottranslate.xml",
              '<string name="app_name_short" translatable="false">Jellyfin</string>',
              '<string name="app_name_short" translatable="false">TARSVideo</string>',
          )

          replace_once(
              "app/src/debug/res/values/strings_donottranslate.xml",
              '<string name="app_name" translatable="false">Jellyfin Debug</string>',
              '<string name="app_name" translatable="false">TARSVideo</string>',
          )

          replace_once(
              "app/build.gradle.kts",
              "defaultConfig {\n        minSdk",
              'defaultConfig {\n        applicationId = "br.seg.douglas.tarsvideo"\n        minSdk',
          )

          replace_once(
              "app/build.gradle.kts",
              "implementation(libs.libass.media)",
              'implementation(libs.libass.media)\n    implementation("org.videolan.android:libvlc-all:3.7.5")',
          )

          replace_once(
              "app/build.gradle.kts",
              'base.archivesName.set("jellyfin-android-v${project.getVersionName()}")',
              'base.archivesName.set("TARSVideo-v${project.getVersionName()}")',
          )

          replace_once(
              "app/src/main/java/org/jellyfin/mobile/app/AppPreferences.kt",
              'get() = sharedPreferences.getString(Constants.PREF_VIDEO_PLAYER_TYPE, VideoPlayerType.EXO_PLAYER)!!',
              'get() = sharedPreferences.getString(Constants.PREF_VIDEO_PLAYER_TYPE, VideoPlayerType.EXTERNAL_PLAYER)!!',
          )

          replace_once(
              "app/src/main/java/org/jellyfin/mobile/settings/SettingsFragment.kt",
              "initialSelection = VideoPlayerType.EXO_PLAYER",
              "initialSelection = VideoPlayerType.EXTERNAL_PLAYER",
          )

          ext = Path(
              "app/src/main/java/org/jellyfin/mobile/bridge/ExternalPlayer.kt"
          )

          s = ext.read_text()

          import_anchor = (
              "import org.jellyfin.mobile.player.interaction.PlayOptions\n"
          )

          if import_anchor not in s:
              raise SystemExit("ExternalPlayer import anchor not found")

          s = s.replace(
              import_anchor,
              import_anchor
              + "import org.jellyfin.mobile.player.vlc.InternalVlcPlayerActivity\n",
              1,
          )

          old_intent = '''val playerIntent = Intent(Intent.ACTION_VIEW).apply {
              if (context.packageManager.isPackageInstalled(appPreferences.externalPlayerApp)) {
                  component = getComponent(appPreferences.externalPlayerApp)
              }
              setDataAndType(url.toUri(), "video/*")'''

          new_intent = '''val playerIntent = Intent(context, InternalVlcPlayerActivity::class.java).apply {
              setDataAndType(url.toUri(), "video/*")'''

          if old_intent not in s:
              raise SystemExit("ExternalPlayer intent block not found")

          s = s.replace(
              old_intent,
              new_intent,
              1,
          )

          ext.write_text(s)

          manifest = Path(
              "app/src/main/AndroidManifest.xml"
          )

          s = manifest.read_text()

          anchor = '''        <activity
              android:name=".MainActivity"'''

          insert = '''        <activity
              android:name=".player.vlc.InternalVlcPlayerActivity"
              android:configChanges="orientation|screenSize|keyboardHidden"
              android:exported="false"
              android:screenOrientation="sensorLandscape"
              android:theme="@style/Theme.AppCompat.NoActionBar" />

          <activity
              android:name=".MainActivity"'''

          if anchor not in s:
              raise SystemExit("AndroidManifest activity anchor not found")

          manifest.write_text(
              s.replace(anchor, insert, 1)
          )

          activity = Path(
              "app/src/main/java/org/jellyfin/mobile/player/vlc/InternalVlcPlayerActivity.kt"
          )

          activity.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          activity.write_text(
              r'''package org.jellyfin.mobile.player.vlc

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import org.jellyfin.mobile.utils.Constants
          import org.videolan.libvlc.LibVLC
          import org.videolan.libvlc.Media
          import org.videolan.libvlc.MediaPlayer
          import org.videolan.libvlc.util.VLCVideoLayout

          class InternalVlcPlayerActivity : AppCompatActivity() {

              private lateinit var libVLC: LibVLC
              private lateinit var mediaPlayer: MediaPlayer
              private lateinit var videoLayout: VLCVideoLayout
              private lateinit var playPause: Button
              private lateinit var seekBar: SeekBar
              private lateinit var positionText: TextView

              private var startPositionMs = 0L
              private var userSeeking = false

              private val progressUpdater = object : Runnable {

                  override fun run() {

                      if (
                          ::mediaPlayer.isInitialized &&
                          !userSeeking
                      ) {

                          val duration =
                              mediaPlayer.length.coerceAtLeast(0L)

                          val position =
                              mediaPlayer.time.coerceAtLeast(0L)

                          if (duration > 0L) {

                              seekBar.max = 1000

                              seekBar.progress =
                                  (
                                      (position * 1000L) /
                                      duration
                                  )
                                  .toInt()
                                  .coerceIn(0, 1000)
                          }

                          positionText.text =
                              "${formatTime(position)} / ${formatTime(duration)}"
                      }

                      seekBar.postDelayed(
                          this,
                          500L,
                      )
                  }
              }

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {

                  super.onCreate(savedInstanceState)

                  window.addFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  )

                  @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY

                  val mediaUri =
                      intent.data
                          ?: run {
                              finishWithResult(false)
                              return
                          }

                  startPositionMs =
                      intent
                          .getIntExtra(
                              "position",
                              0
                          )
                          .toLong()
                          .coerceAtLeast(0L)

                  buildUi()

                  libVLC = LibVLC(
                      this,
                      arrayListOf(
                          "--audio-time-stretch",
                          "--network-caching=1500",
                          "--http-reconnect",
                      ),
                  )

                  mediaPlayer =
                      MediaPlayer(libVLC)

                  mediaPlayer.attachViews(
                      videoLayout,
                      null,
                      false,
                      false,
                  )

                  mediaPlayer.setEventListener {
                      event ->

                      runOnUiThread {

                          when (event.type) {

                              MediaPlayer.Event.Playing -> {

                                  if (
                                      startPositionMs > 0L &&
                                      mediaPlayer.time < 1000L
                                  ) {

                                      mediaPlayer.time =
                                          startPositionMs
                                  }

                                  playPause.text =
                                      "Pause"
                              }

                              MediaPlayer.Event.Paused -> {

                                  playPause.text =
                                      "Play"
                              }

                              MediaPlayer.Event.EndReached -> {

                                  finishWithResult(true)
                              }

                              MediaPlayer.Event.EncounteredError -> {

                                  finishWithResult(false)
                              }
                          }
                      }
                  }

                  val media =
                      Media(
                          libVLC,
                          mediaUri,
                      )

                  media.setHWDecoderEnabled(
                      true,
                      false,
                  )

                  media.addOption(
                      ":network-caching=1500"
                  )

                  media.addOption(
                      ":http-reconnect=true"
                  )

                  intent
                      .getStringExtra(
                          "subtitles_location"
                      )
                      ?.takeIf {
                          it.isNotBlank()
                      }
                      ?.let {
                          subtitle ->

                          media.addSlave(
                              Media.Slave.Type.Subtitle,
                              subtitle,
                              true,
                          )
                      }

                  mediaPlayer.media =
                      media

                  media.release()

                  mediaPlayer.play()

                  seekBar.post(
                      progressUpdater
                  )
              }

              private fun buildUi() {

                  val root =
                      FrameLayout(this).apply {

                          setBackgroundColor(
                              Color.BLACK
                          )
                      }

                  videoLayout =
                      VLCVideoLayout(this)

                  root.addView(
                      videoLayout,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT,
                      ),
                  )

                  val controls =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.HORIZONTAL

                          gravity =
                              Gravity.CENTER_VERTICAL

                          setPadding(
                              16,
                              8,
                              16,
                              8,
                          )

                          setBackgroundColor(
                              0x99000000.toInt()
                          )
                      }

                  val back =
                      Button(this).apply {

                          text =
                              "Voltar"

                          setOnClickListener {

                              finishWithResult(false)
                          }
                      }

                  playPause =
                      Button(this).apply {

                          text =
                              "Pause"

                          setOnClickListener {

                              if (
                                  mediaPlayer.isPlaying
                              ) {

                                  mediaPlayer.pause()

                              } else {

                                  mediaPlayer.play()
                              }
                          }
                      }

                  seekBar =
                      SeekBar(this).apply {

                          max =
                              1000

                          setOnSeekBarChangeListener(
                              object :
                                  SeekBar.OnSeekBarChangeListener {

                                  override fun onProgressChanged(
                                      bar: SeekBar?,
                                      progress: Int,
                                      fromUser: Boolean,
                                  ) = Unit

                                  override fun onStartTrackingTouch(
                                      bar: SeekBar?
                                  ) {

                                      userSeeking =
                                          true
                                  }

                                  override fun onStopTrackingTouch(
                                      bar: SeekBar?
                                  ) {

                                      val duration =
                                          mediaPlayer.length

                                      if (
                                          duration > 0L &&
                                          bar != null
                                      ) {

                                          mediaPlayer.time =
                                              (
                                                  duration *
                                                      bar.progress
                                              ) /
                                                  1000L
                                      }

                                      userSeeking =
                                          false
                                  }
                              }
                          )
                      }

                  positionText =
                      TextView(this).apply {

                          setTextColor(
                              Color.WHITE
                          )

                          text =
                              "00:00 / 00:00"

                          setPadding(
                              12,
                              0,
                              0,
                              0,
                          )
                      }

                  controls.addView(
                      back
                  )

                  controls.addView(
                      playPause
                  )

                  controls.addView(
                      seekBar,
                      LinearLayout.LayoutParams(
                          0,
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          1f,
                      ),
                  )

                  controls.addView(
                      positionText
                  )

                  root.addView(
                      controls,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM,
                      ),
                  )

                  setContentView(
                      root
                  )
              }

              override fun onBackPressed() {

                  finishWithResult(false)
              }

              private fun finishWithResult(
                  ended: Boolean
              ) {

                  val position =
                      if (
                          ::mediaPlayer.isInitialized
                      ) {

                          mediaPlayer.time
                              .coerceAtLeast(0L)

                      } else {

                          0L
                      }

                  val duration =
                      if (
                          ::mediaPlayer.isInitialized
                      ) {

                          mediaPlayer.length
                              .coerceAtLeast(0L)

                      } else {

                          0L
                      }

                  val finalPosition =
                      if (
                          ended &&
                          duration > 0L
                      ) {

                          duration

                      } else {

                          position
                      }

                  setResult(
                      Activity.RESULT_OK,
                      Intent(
                          Constants.VLC_PLAYER_RESULT_ACTION
                      ).apply {

                          putExtra(
                              "extra_position",
                              finalPosition,
                          )

                          putExtra(
                              "extra_duration",
                              duration,
                          )
                      },
                  )

                  finish()
              }

              override fun onDestroy() {

                  if (
                      ::seekBar.isInitialized
                  ) {

                      seekBar.removeCallbacks(
                      
