name: Build TARSVideo Android v0.3.4.9 VLC UI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VLC_OPEN_SUBTITLES_API_KEY: ${{ secrets.VLC_OPEN_SUBTITLES_API_KEY }}
    timeout-minutes: 75

    steps:
      - name: Checkout TARSVideo
        uses: actions/checkout@v4

      - name: Checkout Jellyfin Android
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-android
          ref: f6c4e51aafe7d372d2f275398303037176478456
          path: upstream

      - name: Checkout VLC Android latest player
        uses: actions/checkout@v4
        with:
          repository: videolan/vlc-android
          ref: 4e773d5546c331a57aa67d3cb8103f701f944228
          path: vlc-android-source
          fetch-depth: 1

      - name: Prepare VLC Android source for composite build
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("vlc-android-source")

          # Jellyfin at the pinned commit builds with AGP 9.4.0.
          # A composite Android build cannot mix AGP 9.4.0 and VLC's 9.1.1,
          # so make the included VLC build use the same AGP version.
          settings = root / "settings.gradle"
          text = settings.read_text(encoding="utf-8")

          old_settings_agp = 'id("com.android.settings") version \'9.1.1\''
          new_settings_agp = 'id("com.android.settings") version \'9.4.0\''

          if old_settings_agp not in text:
              raise SystemExit(
                  "VLC settings.gradle AGP 9.1.1 pattern not found"
              )

          text = text.replace(
              old_settings_agp,
              new_settings_agp,
              1,
          )

          # Public VLC checkout does not contain libvlcjni/libvlc.
          # Keep the VLC UI sources, but use the published LibVLC AAR.
          old_include = "include ':libvlcjni:libvlc', ':medialibrary'"
          if old_include not in text:
              raise SystemExit(
                  "VLC libvlcjni include pattern not found"
              )

          text = text.replace(
              old_include,
              "include ':medialibrary'",
              1,
          )

          settings.write_text(
              text,
              encoding="utf-8",
          )

          top_gradle = root / "build.gradle"
          text = top_gradle.read_text(encoding="utf-8")

          old_build_agp = "ext.android_plugin_version = '9.1.1'"
          new_build_agp = "ext.android_plugin_version = '9.4.0'"

          if old_build_agp not in text:
              raise SystemExit(
                  "VLC build.gradle AGP 9.1.1 pattern not found"
              )

          text = text.replace(
              old_build_agp,
              new_build_agp,
              1,
          )

          top_gradle.write_text(
              text,
              encoding="utf-8",
          )

          replacements = {
              "application/resources/build.gradle": [
                  (
                      "devApi project(':libvlcjni:libvlc')",
                      'devApi "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"',
                  ),
              ],
              "application/vlc-android/build.gradle": [
                  (
                      "devApi project(':libvlcjni:libvlc')",
                      'devApi "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"',
                  ),
              ],
              "medialibrary/build.gradle": [
                  (
                      "releaseImplementation project(':libvlcjni:libvlc')",
                      'releaseImplementation "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"',
                  ),
                  (
                      "devImplementation project(':libvlcjni:libvlc')",
                      'devImplementation "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"',
                  ),
              ],
          }

          for rel, pairs in replacements.items():
              path = root / rel
              text = path.read_text(encoding="utf-8")

              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(
                          f"VLC patch pattern not found in {rel}: {old}"
                      )

                  text = text.replace(
                      old,
                      new,
                      1,
                  )

              path.write_text(
                  text,
                  encoding="utf-8",
              )

          # VLC root build.gradle always reads this file.
          (root / "local.properties").touch()

          print("VLC Android source prepared")
          print("AGP aligned: 9.4.0")
          print("Local libvlcjni dependency removed")
          PY

      - name: Check OpenSubtitles API key
        run: |
          set -e
          if [ -z "$VLC_OPEN_SUBTITLES_API_KEY" ]; then
            echo "::error::Missing GitHub Actions secret VLC_OPEN_SUBTITLES_API_KEY"
            echo "Create your OpenSubtitles API consumer key and save it as repository secret VLC_OPEN_SUBTITLES_API_KEY."
            exit 1
          fi
          echo "OpenSubtitles API key is configured."

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply TARSVideo v0.3 patch
        run: |
          set -e

          echo "=== Jellyfin commit ==="
          git -C upstream rev-parse HEAD

          echo "=== VLC Android commit/version ==="
          git -C vlc-android-source rev-parse HEAD
          grep -n "versionName" vlc-android-source/build.gradle | head

          echo "=== AGP alignment ==="
          grep -n "com.android.settings" vlc-android-source/settings.gradle
          grep -n "android_plugin_version" vlc-android-source/build.gradle | head

          mkdir -p \
            upstream/app/src/main/res/drawable-nodpi \
            upstream/app/src/main/res/drawable-720dpi

          cp ./tars_icon.png \
            upstream/app/src/main/res/drawable-nodpi/tars_icon.png

          cp ./tars_icon.png \
            upstream/app/src/main/res/drawable-720dpi/tars_launcher_art.png

          python3 ./patch_tarsvideo.py upstream

          echo "=== Applying TARSVideo v0.3.4 runtime/UI fixes ==="
          python3 - <<'PY'
          from pathlib import Path
          import re

          upstream = Path("upstream")
          vlc = Path("vlc-android-source")

          # VLC overlay requires Android Data Binding generated mapper.
          app_gradle = upstream / "app/build.gradle.kts"
          s = app_gradle.read_text(encoding="utf-8")
          old_features = "    buildFeatures {\n        buildConfig = true\n        viewBinding = true\n        compose = true\n    }"
          new_features = "    buildFeatures {\n        buildConfig = true\n        viewBinding = true\n        dataBinding = true\n        compose = true\n    }"
          if old_features not in s:
              raise SystemExit(
                  "Jellyfin buildFeatures block not found for dataBinding fix"
              )

          app_gradle.write_text(
              s.replace(old_features, new_features, 1),
              encoding="utf-8",
          )

          # OpenSubtitles API key.
          os_service = vlc / "application/resources/src/main/java/org/videolan/resources/opensubtitles/OpenSubtitleService.kt"
          s = os_service.read_text(encoding="utf-8")

          old_getosk = 'fun getOSK() = "${BuildConfig.VLC_OPEN_SUBTITLES_API_KEY}${(-47).forbiddenChars()}Y"'
          new_getosk = 'fun getOSK() = BuildConfig.VLC_OPEN_SUBTITLES_API_KEY'

          if old_getosk not in s:
              raise SystemExit(
                  "OpenSubtitleService getOSK pattern not found"
              )

          s = s.replace(
              old_getosk,
              new_getosk,
              1,
          )

          old_header = '.header("Api-Key", getOSK().substrlng(55))'
          new_header = '.header("Api-Key", getOSK())'

          if old_header not in s:
              raise SystemExit(
                  "OpenSubtitleService Api-Key header pattern not found"
              )

          s = s.replace(
              old_header,
              new_header,
              1,
          )

          os_service.write_text(
              s,
              encoding="utf-8",
          )

          # More heap for full VLC UI + Data Binding.
          gradle_props = upstream / "gradle.properties"
          s = gradle_props.read_text(encoding="utf-8")

          old_heap = "org.gradle.jvmargs=-Xmx2048m"
          new_heap = "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

          if old_heap in s:
              s = s.replace(
                  old_heap,
                  new_heap,
                  1,
              )
          elif "org.gradle.jvmargs=" not in s:
              s = new_heap + "\n" + s

          if "org.gradle.workers.max=" not in s:
              s += "\norg.gradle.workers.max=2\n"

          if "kotlin.daemon.jvmargs=" not in s:
              s += "kotlin.daemon.jvmargs=-Xmx1024m\n"

          gradle_props.write_text(
              s,
              encoding="utf-8",
          )

          # OpenSubtitles download errors must never crash the player.
          sub_dialog = vlc / "application/vlc-android/src/org/videolan/vlc/gui/dialogs/SubtitleDownloaderDialogFragment.kt"
          s = sub_dialog.read_text(encoding="utf-8")

          if "import retrofit2.HttpException" not in s:
              import_anchor = (
                  "import org.videolan.vlc.viewmodels.SubtitlesModel\n"
              )

              if import_anchor not in s:
                  raise SystemExit(
                      "SubtitleDownloader HttpException import anchor not found"
                  )

              s = s.replace(
                  import_anchor,
                  import_anchor + "import retrofit2.HttpException\n",
                  1,
              )

          download_pattern = re.compile(
              r"                State\.NotDownloaded -> \{\n.*?\n                \}(?=\n                State\.Downloaded ->)",
              re.DOTALL,
          )

          new_download_block = '''                State.NotDownloaded -> {
                    try {
                        withContext(Dispatchers.IO) {
                            Log.i(
                                "SubtitleDownload",
                                "Launching download for ${subtitleEvent.item.idSubtitle}"
                            )

                            val downloadLink =
                                OpenSubtitleRepository.getInstance()
                                    .getDownloadLink(
                                        subtitleEvent.item.fileId
                                    )

                            val openSubtitlesLimit =
                                OpenSubtitlesLimit(
                                    downloadLink.requests,
                                    downloadLink.requests +
                                        downloadLink.remaining,
                                    downloadLink.resetTimeUtc
                                )

                            Log.i(
                                "SubtitleDownload",
                                "Subtitle download retrieved: ${downloadLink.link} - ${downloadLink.fileName}"
                            )

                            OpenSubtitlesUtils.saveLimit(
                                settings,
                                openSubtitlesLimit
                            )

                            viewModel.observableLimit.set(
                                openSubtitlesLimit
                            )

                            subtitleEvent.item.zipDownloadLink =
                                downloadLink.link

                            subtitleEvent.item.fileName =
                                downloadLink.fileName

                            subtitleEvent.item.downloadError =
                                false
                        }

                        VLCDownloadManager.download(
                            requireActivity(),
                            subtitleEvent.item,
                            true
                        )
                    } catch (e: Exception) {
                        Log.w(
                            "SubtitleDownload",
                            "OpenSubtitles download failed",
                            e
                        )

                        subtitleEvent.item.downloadError = true

                        withContext(Dispatchers.Main) {
                            val index =
                                downloadAdapter.dataset
                                    ?.indexOf(
                                        subtitleEvent.item
                                    )
                                    ?: -1

                            if (index >= 0) {
                                downloadAdapter
                                    .notifyItemChanged(index)
                            }

                            if (::toast.isInitialized) {
                                toast.cancel()
                            }

                            val http =
                                e as? HttpException

                            val errorBody =
                                if (http != null) {
                                    try {
                                        http.response()
                                            ?.errorBody()
                                            ?.string()
                                            ?.replace(
                                                "\\n",
                                                " "
                                            )
                                            ?.take(240)
                                    } catch (
                                        _: Exception
                                    ) {
                                        null
                                    }
                                } else null

                            val detail = when {
                                http?.code() == 406 &&
                                    viewModel
                                        .observableUser
                                        .get()
                                        ?.logged != true -> {
                                    state =
                                        SubDownloadDialogState.Login

                                    "HTTP 406: limite de download ou arquivo recusado. Entre na sua conta do OpenSubtitles para usar a cota da conta."
                                }

                                http?.code() == 406 -> {
                                    "HTTP 406: ${errorBody ?: "download recusado pelo OpenSubtitles"}"
                                }

                                http?.code() == 429 -> {
                                    "HTTP 429: limite temporário do OpenSubtitles. Aguarde e tente novamente."
                                }

                                http != null -> {
                                    "HTTP ${http.code()}: ${errorBody ?: http.message()}"
                                }

                                else -> {
                                    e.message
                                        ?.takeIf {
                                            it.isNotBlank()
                                        }
                                        ?: "erro da API"
                                }
                            }

                            toast = Toast.makeText(
                                requireContext(),
                                detail,
                                Toast.LENGTH_LONG
                            )

                            toast.show()
                        }
                    }
                }'''

          s, replaced = download_pattern.subn(
              new_download_block,
              s,
              count=1,
          )

          if replaced != 1:
              raise SystemExit(
                  "VLC subtitle NotDownloaded branch replacement failed: $replaced"
              )

          sub_dialog.write_text(
              s,
              encoding="utf-8",
          )

          # Brazilian Portuguese error message.
          ptbr_strings = vlc / "application/resources/src/main/res/values-pt-rBR/strings.xml"
          s = ptbr_strings.read_text(
              encoding="utf-8"
          )

          if (
              'name="open_subs_download_link_error"'
              not in s
          ):
              anchor = (
                  '    <string name="open_subs_download_error">'
                  'O OpenSubtitles está indisponível. '
                  'Por favor, tente novamente mais tarde'
                  '</string>'
              )

              if anchor not in s:
                  raise SystemExit(
                      "VLC pt-BR OpenSubtitles string anchor not found"
                  )

              new_ptbr_string = (
                  '    <string name="open_subs_download_link_error">'
                  'Não foi possível obter o link desta legenda. '
                  'Verifique sua cota do OpenSubtitles '
                  'ou entre na sua conta.'
                  '</string>'
              )

              s = s.replace(
                  anchor,
                  anchor + "\n" + new_ptbr_string,
                  1,
              )

              ptbr_strings.write_text(
                  s,
                  encoding="utf-8",
              )

          # Use VLC StartActivity.
          ext = upstream / "app/src/main/java/org/jellyfin/mobile/bridge/ExternalPlayer.kt"
          s = ext.read_text(encoding="utf-8")

          s = s.replace(
              "import org.videolan.vlc.gui.video.VideoPlayerActivity",
              "import org.videolan.vlc.StartActivity",
          )

          s = s.replace(
              "VideoPlayerActivity::class.java",
              "StartActivity::class.java",
          )

          # Accept package-qualified VLC result action.
          s = s.replace(
              "        when (val action = intent?.action) {",
              "        val action = intent?.action\n        when {",
              1,
          )

          replacements = {
              "            Constants.MPV_PLAYER_RESULT_ACTION -> handleMPVPlayer(resultCode, intent)":
                  "            action == Constants.MPV_PLAYER_RESULT_ACTION -> handleMPVPlayer(resultCode, intent)",

              "            Constants.MX_PLAYER_RESULT_ACTION -> handleMXPlayer(resultCode, intent)":
                  "            action == Constants.MX_PLAYER_RESULT_ACTION -> handleMXPlayer(resultCode, intent)",

              "            Constants.VLC_PLAYER_RESULT_ACTION -> handleVLCPlayer(resultCode, intent)":
                  "            action == Constants.VLC_PLAYER_RESULT_ACTION || action?.endsWith(\".player.result\") == true -> handleVLCPlayer(resultCode, intent)",

              "            Constants.MPVKT_PLAYER_RESULT_ACTION -> handleMPVKTPlayer(resultCode, intent)":
                  "            action == Constants.MPVKT_PLAYER_RESULT_ACTION -> handleMPVKTPlayer(resultCode, intent)",
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(
                      f"ExternalPlayer result action pattern not found: {old}"
                  )

              s = s.replace(
                  old,
                  new,
                  1,
              )

          # Jellyfin external subtitle URLs require authentication.
          #
          # ApiClient.createUrl() by itself only builds the URL and
          # does not put the user's access token in it. VLC is not
          # using Jellyfin's HTTP client, so add ApiKey to the URLs.
          old_external_subs = '''            val externalSubs = source.externalSubtitleStreams
            val enabledSubUrl = when {
                source.selectedSubtitleStream != null -> {
                    externalSubs.find { stream -> stream.index == source.selectedSubtitleStream?.index }?.let { sub ->
                        apiClient.createUrl(sub.deliveryUrl)
                    }
                }
                else -> null
            }

            // MX Player API / MPV
            val subtitleUris = externalSubs.map { stream ->
                apiClient.createUrl(stream.deliveryUrl).toUri()
            }
            putExtra("subs", subtitleUris.toTypedArray())
            putExtra("subs.name", externalSubs.map(ExternalSubtitleStream::displayTitle).toTypedArray())
            putExtra("subs.filename", externalSubs.map(ExternalSubtitleStream::language).toTypedArray())
            putExtra("subs.enable", enabledSubUrl?.let { url -> arrayOf(url.toUri()) } ?: emptyArray())

            // VLC
            if (enabledSubUrl != null) putExtra("subtitles_location", enabledSubUrl)'''

          new_external_subs = '''            val externalSubs = source.externalSubtitleStreams

            val tarsSubtitleQuery =
                apiClient.accessToken
                    ?.takeIf {
                        it.isNotBlank()
                    }
                    ?.let { token ->
                        mapOf(
                            ApiClient.QUERY_ACCESS_TOKEN
                                to token
                        )
                    }
                    ?: emptyMap()

            val tarsExternalSubUrls =
                externalSubs.associate { stream ->
                    stream.index to
                        apiClient.createUrl(
                            stream.deliveryUrl,
                            queryParameters =
                                tarsSubtitleQuery,
                        )
                }

            val enabledSubUrl =
                source.selectedSubtitleStream
                    ?.index
                    ?.let(
                        tarsExternalSubUrls::get
                    )

            // MX Player API / MPV / embedded VLC
            val subtitleUris =
                externalSubs.mapNotNull {
                    stream ->
                    tarsExternalSubUrls[
                        stream.index
                    ]?.toUri()
                }

            putExtra(
                "subs",
                subtitleUris.toTypedArray()
            )

            putExtra(
                "subs.name",
                externalSubs.map(
                    ExternalSubtitleStream::displayTitle
                ).toTypedArray()
            )

            putExtra(
                "subs.filename",
                externalSubs.map(
                    ExternalSubtitleStream::language
                ).toTypedArray()
            )

            putExtra(
                "subs.enable",
                enabledSubUrl?.let { url ->
                    arrayOf(url.toUri())
                } ?: emptyArray()
            )

            // VLC selected external subtitle
            if (enabledSubUrl != null) {
                putExtra(
                    "subtitles_location",
                    enabledSubUrl
                )
            }'''

          if old_external_subs not in s:
              raise SystemExit(
                  "Jellyfin external subtitle handoff block not found"
              )

          s = s.replace(
              old_external_subs,
              new_external_subs,
              1,
          )

          ext.write_text(
              s,
              encoding="utf-8",
          )

          # Allow Jellyfin HTTP/HTTPS streams through VLC.
          start = vlc / "application/vlc-android/src/org/videolan/vlc/StartActivity.kt"
          s = start.read_text(encoding="utf-8")

          old_line = '''        if ((intent.data != null && intent.data!!.scheme == "content" && FileUtils.getUri(intent.data) != null)'''

          new_lines = '''        if (intent.data?.scheme == "http"
            || intent.data?.scheme == "https"
            || (intent.data != null && intent.data!!.scheme == "content" && FileUtils.getUri(intent.data) != null)'''

          if old_line not in s:
              raise SystemExit(
                  "VLC StartActivity HTTP/content gate line not found"
              )

          start.write_text(
              s.replace(
                  old_line,
                  new_lines,
                  1,
              ),
              encoding="utf-8",
          )

          # Jellyfin already puts all external subtitles in the
          # standard "subs" Parcelable Uri[] extra. VLC normally
          # ignores that field, so register all those Uris.
          video_activity = vlc / "application/vlc-android/src/org/videolan/vlc/gui/video/VideoPlayerActivity.kt"
          s = video_activity.read_text(
              encoding="utf-8"
          )

          old_vlc_load = "\n".join([
              "                subtitlesExtraPath = extras.getString(PLAY_EXTRA_SUBTITLES_LOCATION)",
              "                if (!subtitlesExtraPath.isNullOrEmpty()) service.addSubtitleTrack(subtitlesExtraPath!!, true)",
          ])

          new_vlc_load = "\n".join([
              "                subtitlesExtraPath = extras.getString(PLAY_EXTRA_SUBTITLES_LOCATION)",
              "",
              '                extras.getParcelableArray("subs")',
              "                    ?.asSequence()",
              "                    ?.mapNotNull { it as? Uri }",
              "                    ?.filter { it.toString() != subtitlesExtraPath }",
              "                    ?.distinct()",
              "                    ?.forEach { subtitleUri ->",
              "                        service.addSubtitleTrack(subtitleUri, false)",
              "                    }",
              "",
              "                if (!subtitlesExtraPath.isNullOrEmpty()) {",
              "                    service.addSubtitleTrack(subtitlesExtraPath!!, true)",
              "                }",
          ])

          if old_vlc_load not in s:
              raise SystemExit(
                  "VLC VideoPlayerActivity subtitle load block not found"
              )

          s = s.replace(
              old_vlc_load,
              new_vlc_load,
              1,
          )

          video_activity.write_text(
              s,
              encoding="utf-8",
          )

          # Initialize VLC runtime.
          app = upstream / "app/src/main/java/org/jellyfin/mobile/JellyfinApplication.kt"
          s = app.read_text(encoding="utf-8")

          import_anchor = (
              "import org.videolan.resources.AppContextProvider\n"
          )

          extra_imports = (
              "import org.videolan.resources.AppContextProvider\n"
              "import org.videolan.resources.VLCInstance\n"
              "import org.videolan.tools.Settings\n"
              "import org.videolan.libvlc.Dialog\n"
              "import org.videolan.vlc.gui.helpers.NotificationHelper\n"
              "import org.videolan.vlc.util.DialogDelegate\n"
          )

          if (
              "import org.videolan.tools.Settings"
              not in s
          ):
              if import_anchor not in s:
                  raise SystemExit(
                      "JellyfinApplication VLC import anchor not found"
                  )

              s = s.replace(
                  import_anchor,
                  extra_imports,
                  1,
              )

          factory_anchor = (
              "        FactoryManager.registerFactory("
              "ILibVLCFactory.factoryId, "
              "LibVLCFactory())\n"
          )

          runtime_init = (
              "        FactoryManager.registerFactory("
              "ILibVLCFactory.factoryId, "
              "LibVLCFactory())\n\n"
              "        Settings.getInstance(this)\n"
              "        Settings.initPostMigration(this)\n"
              "        NotificationHelper."
              "createNotificationChannels(this)\n\n"
              "        if (VLCInstance."
              "testCompatibleCPU(this)) {\n"
              "            Dialog.setCallbacks("
              "VLCInstance.getInstance(this), "
              "DialogDelegate)\n"
              "        }\n"
          )

          if "Settings.getInstance(this)" not in s:
              if factory_anchor not in s:
                  raise SystemExit(
                      "JellyfinApplication factory anchor not found"
                  )

              s = s.replace(
                  factory_anchor,
                  runtime_init,
                  1,
              )

          app.write_text(
              s,
              encoding="utf-8",
          )

          # Remove VLC secondary launcher.
          vlc_manifest = (
              vlc /
              "application/vlc-android/AndroidManifest.xml"
          )

          s = vlc_manifest.read_text(
              encoding="utf-8"
          )

          activity_pos = s.find(
              'android:name=".StartActivity"'
          )

          if activity_pos == -1:
              raise SystemExit(
                  "VLC StartActivity manifest entry not found"
              )

          filter_start = s.find(
              "<intent-filter>",
              activity_pos,
          )

          filter_end = s.find(
              "</intent-filter>",
              filter_start,
          )

          if (
              filter_start == -1
              or filter_end == -1
          ):
              raise SystemExit(
                  "VLC StartActivity launcher filter not found"
              )

          filter_end += len(
              "</intent-filter>"
          )

          launcher_block = s[
              filter_start:filter_end
          ]

          if (
              'android.intent.action.MAIN'
              not in launcher_block
              or
              'android.intent.category.LAUNCHER'
              not in launcher_block
          ):
              raise SystemExit(
                  "First VLC StartActivity filter is not launcher"
              )

          s = (
              s[:filter_start]
              + s[filter_end:]
          )

          vlc_manifest.write_text(
              s,
              encoding="utf-8",
          )

          # Force fixed VLC player.
          prefs = upstream / "app/src/main/java/org/jellyfin/mobile/app/AppPreferences.kt"
          s = prefs.read_text(
              encoding="utf-8"
          )

          s, n = re.subn(
              r'(@VideoPlayerType\s+val videoPlayerType: String\s+get\(\) = )[^\n]+',
              r'\1VideoPlayerType.EXTERNAL_PLAYER',
              s,
              count=1,
          )

          if n != 1:
              raise SystemExit(
                  "AppPreferences videoPlayerType pattern not found"
              )

          prefs.write_text(
              s,
              encoding="utf-8",
          )

          # Fixed player settings entry.
          settings = upstream / "app/src/main/java/org/jellyfin/mobile/settings/SettingsFragment.kt"
          s = settings.read_text(
              encoding="utf-8"
          )

          begin = s.find(
              "        categoryHeader(PREF_CATEGORY_VIDEO_PLAYER)"
          )

          end = s.find(
              "        val subtitleSettingsIntent",
              begin,
          )

          if begin == -1 or end == -1:
              raise SystemExit(
                  "Settings video section boundaries not found"
              )

          fixed_video = '''        categoryHeader(PREF_CATEGORY_VIDEO_PLAYER) {
              titleRes = R.string.pref_category_video_player
          }

          pref("tarsvideo_vlc_player") {
              title = "TARSVideo VLC"
              summary = "Player VLC integrado ao TARSVideo • Direct Play / Direct Stream"
          }
          '''

          s = (
              s[:begin]
              + fixed_video
              + s[end:]
          )

          settings.write_text(
              s,
              encoding="utf-8",
          )

          for rel, title in [
              (
                  "app/src/main/res/values/strings.xml",
                  "TARSVideo Settings",
              ),
              (
                  "app/src/main/res/values-pt/strings.xml",
                  "Configurações do TARSVideo",
              ),
          ]:
              p = upstream / rel

              if not p.exists():
                  continue

              x = p.read_text(
                  encoding="utf-8"
              )

              x, n = re.subn(
                  r'<string name="activity_name_settings">.*?</string>',
                  f'<string name="activity_name_settings">{title}</string>',
                  x,
                  count=1,
              )

              if n:
                  p.write_text(
                      x,
                      encoding="utf-8",
                  )

          # Better adaptive icon safe area.
          foreground = upstream / "app/src/main/res/drawable/tars_icon_foreground.xml"

          foreground.write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
              android:drawable="@drawable/tars_launcher_art"
              android:insetLeft="10dp"
              android:insetTop="10dp"
              android:insetRight="10dp"
              android:insetBottom="10dp" />
          ''',
              encoding="utf-8",
          )

          adaptive = upstream / "app/src/main/res/mipmap-anydpi-v26/tars_launcher.xml"

          adaptive.write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/tars_launcher_background" />
              <foreground android:drawable="@drawable/tars_icon_foreground" />
          </adaptive-icon>
          ''',
              encoding="utf-8",
          )

          legacy = upstream / "app/src/main/res/mipmap-anydpi/tars_launcher.xml"

          legacy.write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/tars_launcher_background" />
              <item android:drawable="@drawable/tars_icon_foreground" />
          </layer-list>
          ''',
              encoding="utf-8",
          )

          styles = upstream / "app/src/main/res/values/styles.xml"

          s = styles.read_text(
              encoding="utf-8"
          ).replace(
              "@drawable/tars_icon_padded",
              "@drawable/tars_icon_foreground",
          )

          styles.write_text(
              s,
              encoding="utf-8",
          )

          web_layout = upstream / "app/src/main/res/layout/fragment_webview.xml"

          s = web_layout.read_text(
              encoding="utf-8"
          ).replace(
              "@drawable/tars_icon_padded",
              "@drawable/tars_icon_foreground",
          )

          web_layout.write_text(
              s,
              encoding="utf-8",
          )

          print(
              "TARSVideo v0.3.4.9 fixes applied"
          )
          PY

          echo "=== TARSVideo v0.3.4.9 patch done ==="

      - name: Resolve Jellyfin VLC manifest conflicts
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "upstream/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(
              encoding="utf-8"
          )

          targets = [
              'android:name="com.google.android.gms.car.notification.SmallIcon"',
              'android:name="androidx.car.app.TintableAttributionIcon"',
          ]

          for target in targets:
              pos = text.find(target)

              if pos == -1:
                  raise SystemExit(
                      f"Manifest metadata not found: {target}"
                  )

              end = text.find(
                  "/>",
                  pos,
              )

              if end == -1:
                  raise SystemExit(
                      f"Manifest metadata end not found: {target}"
                  )

              block = text[pos:end]

              if (
                  'tools:replace="android:resource"'
                  not in block
              ):
                  text = (
                      text[:end]
                      + '\n            tools:replace="android:resource"'
                      + text[end:]
                  )

          manifest.write_text(
              text,
              encoding="utf-8",
          )

          print(
              "Jellyfin/VLC car metadata conflicts resolved"
          )
          PY

      - name: Verify embedded VLC dependency
        working-directory: upstream
        run: |
          set -e
          chmod +x gradlew

          ./gradlew \
            :app:dependencies \
            --configuration libreDebugRuntimeClasspath \
            > ../vlc-deps.txt

          echo "=== VLC dependency lines ==="

          grep -n \
            "org.videolan.tars:vlc-android\|libvlc-all\|medialibrary-all" \
            ../vlc-deps.txt \
            | head -80 \
            || true

          if grep -q \
            "org.videolan.tars:vlc-android:3.7.1 FAILED" \
            ../vlc-deps.txt
          then
            echo "ERROR: embedded VLC project substitution failed"
            exit 1
          fi

      - name: Build APK
        working-directory: upstream
        run: |
          set -e
          chmod +x gradlew

          ./gradlew \
            assembleLibreDebug \
            --max-workers=2 \
            --stacktrace

      - name: Collect APK
        run: |
          set -e

          mkdir -p dist

          find upstream/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="$(
            find upstream/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "No APK found"
            exit 1
          fi

          cp "$APK" \
            dist/TARSVideo-v0.3.4.9-VLC-debug.apk

          ls -lh \
            dist/TARSVideo-v0.3.4.9-VLC-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TARSVideo-Android-v0.3.4.9-VLC
          path: dist/TARSVideo-v0.3.4.9-VLC-debug.apk
          retention-days: 14
          if-no-files-found: error
