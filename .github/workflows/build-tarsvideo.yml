name: Build TARSVideo Android v0.3 VLC UI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout TARSVideo
        uses: actions/checkout@v4

      - name: Checkout Jellyfin Android
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-android
          ref: f6c4e51aafe7d372d2f275398303037176478456
          path: upstream

      - name: Checkout VLC Android latest player
        uses: actions/checkout@v4
        with:
          repository: videolan/vlc-android
          ref: 4e773d5546c331a57aa67d3cb8103f701f944228
          path: vlc-android-source
          fetch-depth: 1

      - name: Prepare VLC Android source for composite build
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("vlc-android-source")

          # Jellyfin at the pinned commit builds with AGP 9.4.0.
          # A composite Android build cannot mix AGP 9.4.0 and VLC's 9.1.1,
          # so make the included VLC build use the same AGP version.
          settings = root / "settings.gradle"
          text = settings.read_text(encoding="utf-8")

          old_settings_agp = 'id("com.android.settings") version \'9.1.1\''
          new_settings_agp = 'id("com.android.settings") version \'9.4.0\''

          if old_settings_agp not in text:
              raise SystemExit(
                  "VLC settings.gradle AGP 9.1.1 pattern not found"
              )

          text = text.replace(
              old_settings_agp,
              new_settings_agp,
              1,
          )

          # Public VLC checkout does not contain libvlcjni/libvlc.
          # Keep the VLC UI sources, but use the published LibVLC AAR.
          old_include = "include ':libvlcjni:libvlc', ':medialibrary'"
          if old_include not in text:
              raise SystemExit(
                  "VLC libvlcjni include pattern not found"
              )

          text = text.replace(
              old_include,
              "include ':medialibrary'",
              1,
          )

          settings.write_text(
              text,
              encoding="utf-8",
          )

          top_gradle = root / "build.gradle"
          text = top_gradle.read_text(encoding="utf-8")

          old_build_agp = "ext.android_plugin_version = '9.1.1'"
          new_build_agp = "ext.android_plugin_version = '9.4.0'"

          if old_build_agp not in text:
              raise SystemExit(
                  "VLC build.gradle AGP 9.1.1 pattern not found"
              )

          text = text.replace(
              old_build_agp,
              new_build_agp,
              1,
          )

          top_gradle.write_text(
              text,
              encoding="utf-8",
          )

          replacements = {
              "application/resources/build.gradle": [
                  (
                      "devApi project(':libvlcjni:libvlc')",
                      'devApi "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"',
                  ),
              ],
              "application/vlc-android/build.gradle": [
                  (
                      "devApi project(':libvlcjni:libvlc')",
                      'devApi "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"',
                  ),
              ],
              "medialibrary/build.gradle": [
                  (
                      "releaseImplementation project(':libvlcjni:libvlc')",
                      'releaseImplementation "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"',
                  ),
                  (
                      "devImplementation project(':libvlcjni:libvlc')",
                      'devImplementation "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"',
                  ),
              ],
          }

          for rel, pairs in replacements.items():
              path = root / rel
              text = path.read_text(encoding="utf-8")

              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(
                          f"VLC patch pattern not found in {rel}: {old}"
                      )

                  text = text.replace(
                      old,
                      new,
                      1,
                  )

              path.write_text(
                  text,
                  encoding="utf-8",
              )

          # VLC root build.gradle always reads this file.
          (root / "local.properties").touch()

          print("VLC Android source prepared")
          print("AGP aligned: 9.4.0")
          print("Local libvlcjni dependency removed")
          PY

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply TARSVideo v0.3 patch
        run: |
          set -e

          echo "=== Jellyfin commit ==="
          git -C upstream rev-parse HEAD

          echo "=== VLC Android commit/version ==="
          git -C vlc-android-source rev-parse HEAD
          grep -n "versionName" vlc-android-source/build.gradle | head

          echo "=== AGP alignment ==="
          grep -n "com.android.settings" vlc-android-source/settings.gradle
          grep -n "android_plugin_version" vlc-android-source/build.gradle | head

          mkdir -p \
            upstream/app/src/main/res/drawable-nodpi

          cp ./tars_icon.png \
            upstream/app/src/main/res/drawable-nodpi/tars_icon.png

          python3 ./patch_tarsvideo.py upstream

          echo "=== TARSVideo v0.3 patch done ==="

      - name: Resolve Jellyfin VLC manifest conflicts
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("upstream/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          targets = [
              'android:name="com.google.android.gms.car.notification.SmallIcon"',
              'android:name="androidx.car.app.TintableAttributionIcon"',
          ]

          for target in targets:
              pos = text.find(target)
              if pos == -1:
                  raise SystemExit(f"Manifest metadata not found: {target}")

              end = text.find("/>", pos)
              if end == -1:
                  raise SystemExit(f"Manifest metadata end not found: {target}")

              block = text[pos:end]
              if 'tools:replace="android:resource"' not in block:
                  text = text[:end] + '\n            tools:replace="android:resource"' + text[end:]

          manifest.write_text(text, encoding="utf-8")
          print("Jellyfin/VLC car metadata conflicts resolved")
          PY

      - name: Verify embedded VLC dependency
        working-directory: upstream
        run: |
          set -e
          chmod +x gradlew

          ./gradlew \
            :app:dependencies \
            --configuration libreDebugRuntimeClasspath \
            > ../vlc-deps.txt

          echo "=== VLC dependency lines ==="
          grep -n \
            "org.videolan.tars:vlc-android\|libvlc-all\|medialibrary-all" \
            ../vlc-deps.txt \
            | head -80 \
            || true

          if grep -q "org.videolan.tars:vlc-android:3.7.1 FAILED" ../vlc-deps.txt; then
            echo "ERROR: embedded VLC project substitution failed"
            exit 1
          fi

      - name: Build APK
        working-directory: upstream
        run: |
          set -e
          chmod +x gradlew

          ./gradlew \
            assembleLibreDebug \
            --stacktrace

      - name: Collect APK
        run: |
          set -e
          mkdir -p dist

          find upstream/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="$(
            find upstream/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "No APK found"
            exit 1
          fi

          cp "$APK" \
            dist/TARSVideo-v0.3-VLC-debug.apk

          ls -lh \
            dist/TARSVideo-v0.3-VLC-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TARSVideo-Android-v0.3-VLC
          path: dist/TARSVideo-v0.3-VLC-debug.apk
          retention-days: 14
          if-no-files-found: error
