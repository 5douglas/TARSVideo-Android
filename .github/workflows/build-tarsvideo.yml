name: Build TARSVideo Android v0.3 VLC UI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout TARSVideo
        uses: actions/checkout@v4

      - name: Checkout Jellyfin Android
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-android
          ref: f6c4e51aafe7d372d2f275398303037176478456
          path: upstream

      - name: Checkout VLC Android latest player
        uses: actions/checkout@v4
        with:
          repository: videolan/vlc-android
          ref: 4e773d5546c331a57aa67d3cb8103f701f944228
          path: vlc-android-source
          fetch-depth: 1

      - name: Prepare VLC Android source for composite build
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("vlc-android-source")

          settings = root / "settings.gradle"
          text = settings.read_text(encoding="utf-8")
          text = text.replace(
              "include ':libvlcjni:libvlc', ':medialibrary'",
              "include ':medialibrary'",
          )
          settings.write_text(text, encoding="utf-8")

          replacements = {
              "application/resources/build.gradle": [
                  (
                      "devApi project(':libvlcjni:libvlc')",
                      'devApi "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"',
                  ),
              ],
              "application/vlc-android/build.gradle": [
                  (
                      "devApi project(':libvlcjni:libvlc')",
                      'devApi "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"',
                  ),
              ],
              "medialibrary/build.gradle": [
                  (
                      "releaseImplementation project(':libvlcjni:libvlc')",
                      'releaseImplementation "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"',
                  ),
                  (
                      "devImplementation project(':libvlcjni:libvlc')",
                      'devImplementation "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"',
                  ),
              ],
          }

          for rel, pairs in replacements.items():
              path = root / rel
              text = path.read_text(encoding="utf-8")

              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(
                          f"VLC patch pattern not found in {rel}: {old}"
                      )

                  text = text.replace(
                      old,
                      new,
                      1,
                  )

              path.write_text(
                  text,
                  encoding="utf-8",
              )

          (root / "local.properties").touch()

          print(
              "VLC Android source prepared for composite build"
          )
          PY

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply TARSVideo v0.3 patch
        run: |
          set -e

          echo "=== TARSVideo files ==="
          ls -la

          echo "=== Jellyfin commit ==="
          git -C upstream rev-parse HEAD

          echo "=== VLC Android commit/version ==="
          git -C vlc-android-source rev-parse HEAD
          grep -n "versionName" vlc-android-source/build.gradle | head

          mkdir -p upstream/app/src/main/res/drawable-nodpi
          cp ./tars_icon.png             upstream/app/src/main/res/drawable-nodpi/tars_icon.png

          python3 ./patch_tarsvideo.py upstream

          echo "=== TARSVideo v0.3 patch done ==="

      - name: Verify embedded VLC dependency
        working-directory: upstream
        run: |
          set -e
          chmod +x gradlew

          ./gradlew             :app:dependencies             --configuration libreDebugRuntimeClasspath             > ../vlc-deps.txt

          grep -n             "org.videolan.tars:vlc-android\|libvlc-all\|medialibrary-all"             ../vlc-deps.txt             | head -60             || true

      - name: Build APK
        working-directory: upstream
        run: |
          set -e
          chmod +x gradlew

          ./gradlew             assembleLibreDebug             --stacktrace

      - name: Collect APK
        run: |
          set -e

          mkdir -p dist

          find upstream/app/build/outputs/apk             -type f             -name "*.apk"             -print

          APK="$(
            find upstream/app/build/outputs/apk               -type f               -name "*.apk"               | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "No APK found"
            exit 1
          fi

          cp "$APK"             dist/TARSVideo-v0.3-VLC-debug.apk

          ls -lh             dist/TARSVideo-v0.3-VLC-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TARSVideo-Android-v0.3-VLC
          path: dist/TARSVideo-v0.3-VLC-debug.apk
          retention-days: 14
          if-no-files-found: error
