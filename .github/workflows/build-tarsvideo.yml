name: Build TARSVideo Android v0.4.3 Native + TARS Chat + Notifications

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout TARSVideo
        uses: actions/checkout@v4

      - name: Checkout Jellyfin Android
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-android
          ref: f6c4e51aafe7d372d2f275398303037176478456
          path: upstream

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore v0.4.2 base patch
        run: |
          set -e

          curl -fL \
            https://raw.githubusercontent.com/5douglas/TARSVideo-Android/a115b82ee67d44ca3ade866e2ae8c97020abb682/patch_tarsvideo.py \
            -o patch_tarsvideo_base_v042.py

          python3 -m py_compile patch_tarsvideo_base_v042.py
          python3 -m py_compile patch_tarsvideo.py

      - name: Apply TARSVideo v0.4.3 patches
        run: |
          set -e

          mkdir -p \
            upstream/app/src/main/res/drawable-nodpi

          cp ./tars_icon.png \
            upstream/app/src/main/res/drawable-nodpi/tars_icon.png

          # Apply the last known-good full TARSVideo v0.4.2 patch first.
          python3 ./patch_tarsvideo_base_v042.py upstream

          # The repository's current patch_tarsvideo.py is the v0.4.3
          # incremental patch: stable DeviceId + Android notifications.
          python3 ./patch_tarsvideo.py upstream

      - name: Verify TARSVideo v0.4.3
        run: |
          set -e

          echo "===== TARSVideo v0.4.3 preflight ====="

          grep -n \
            'applicationId = "br.seg.douglas.tarsvideo"' \
            upstream/app/build.gradle.kts

          grep -n \
            'base.archivesName.set("TARSVideo-v0.4.3")' \
            upstream/app/build.gradle.kts

          grep -n \
            'javaScriptEnabled = true' \
            upstream/app/src/main/java/org/jellyfin/mobile/utils/WebViewUtils.kt

          grep -n \
            'domStorageEnabled = true' \
            upstream/app/src/main/java/org/jellyfin/mobile/utils/WebViewUtils.kt

          grep -n \
            'JavaScript Injector scripts' \
            upstream/app/src/main/java/org/jellyfin/mobile/webapp/WebViewFragment.kt

          grep -n \
            'deviceInfo = baseDeviceInfo' \
            upstream/app/src/main/java/org/jellyfin/mobile/app/ApiClientController.kt

          if grep -n \
            'baseDeviceInfo\.copy(id = baseDeviceInfo\.id +' \
            upstream/app/src/main/java/org/jellyfin/mobile/app/ApiClientController.kt
          then
            echo "ERROR: duplicate Android DeviceId logic still present"
            exit 1
          fi

          grep -n \
            'fun showTarsNotification' \
            upstream/app/src/main/java/org/jellyfin/mobile/bridge/NativeInterface.kt

          grep -n \
            'fun requestTarsNotificationPermission' \
            upstream/app/src/main/java/org/jellyfin/mobile/bridge/NativeInterface.kt

          grep -n \
            '/native/tarsnotifications.js' \
            upstream/app/src/main/assets/native/injectionScript.js

          test -f \
            upstream/app/src/main/assets/native/tarsnotifications.js

          test -f \
            upstream/app/src/main/res/drawable/tars_notification.xml

          grep -n \
            'android.permission.POST_NOTIFICATIONS' \
            upstream/app/src/main/AndroidManifest.xml

          grep -n \
            'tarsvideo_native_player_v040' \
            upstream/app/src/main/java/org/jellyfin/mobile/JellyfinApplication.kt

          grep -n \
            'windowSplashScreenAnimatedIcon.*tars_empty_splash' \
            upstream/app/src/main/res/values/styles.xml

          grep -n \
            '<foreground android:drawable="@drawable/tars_icon"' \
            upstream/app/src/main/res/mipmap-anydpi-v26/tars_launcher.xml

          grep -n \
            'tarsvideo-hide-jellyfin-splash' \
            upstream/app/src/main/java/org/jellyfin/mobile/webapp/WebViewFragment.kt

          if grep -n \
            'androidx.compose.material.CircularProgressIndicator()' \
            upstream/app/src/main/java/org/jellyfin/mobile/ui/screens/connect/ConnectScreen.kt
          then
            echo "ERROR: blue connection spinner is still active"
            exit 1
          fi

          if grep -n \
            'windowSplashScreenAnimatedIcon.*ic_splash' \
            upstream/app/src/main/res/values/styles.xml
          then
            echo "ERROR: Jellyfin splash icon is still active"
            exit 1
          fi

          if grep -n -E \
            'org\.videolan\.tars:vlc-android|vlc-android-source|libvlc-all|medialibrary-all' \
            upstream/app/build.gradle.kts \
            upstream/settings.gradle.kts
          then
            echo "ERROR: stale embedded VLC dependency detected"
            exit 1
          fi

          echo "PLAYER=JELLYFIN_NATIVE_EXOPLAYER"
          echo "JAVASCRIPT_INJECTOR_COMPAT=YES"
          echo "TARS_CHAT_WEBVIEW_READY=YES"
          echo "ANDROID_DEVICE_ID_MODE=STABLE_BASE_DEVICE_ID"
          echo "SYNCPLAY_DUPLICATE_SESSION_FIX=ENABLED"
          echo "TARS_NATIVE_NOTIFICATION_BRIDGE=ENABLED"
          echo "TARS_CHAT_NATIVE_NOTIFICATION_ADAPTER=ENABLED"
          echo "SYSTEM_SPLASH_ICON=REMOVED"
          echo "LAUNCHER_ICON_PADDING=REMOVED"
          echo "CONNECT_SPINNER=REMOVED"
          echo "JELLYFIN_WEB_SPLASH=HIDDEN_BEFORE_FADE_IN"

      - name: Build APK
        working-directory: upstream
        run: |
          set -e
          chmod +x gradlew

          ./gradlew \
            assembleLibreDebug \
            --max-workers=2 \
            --stacktrace

      - name: Collect APK
        run: |
          set -e

          mkdir -p dist

          APK="$(
            find upstream/app/build/outputs/apk/libre/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "No APK found"
            exit 1
          fi

          cp "$APK" \
            dist/TARSVideo-v0.4.3-native-debug.apk

          (
            cd dist
            sha256sum \
              TARSVideo-v0.4.3-native-debug.apk \
              > TARSVideo-v0.4.3-native-debug.apk.sha256
          )

          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TARSVideo-Android-v0.4.3-Native-TARSChat-Notifications
          path: |
            dist/TARSVideo-v0.4.3-native-debug.apk
            dist/TARSVideo-v0.4.3-native-debug.apk.sha256
          retention-days: 14
          if-no-files-found: error
