name: Build TARSVideo Android v0.3.4.9.2 VLC UI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      VLC_OPEN_SUBTITLES_API_KEY: ${{ secrets.VLC_OPEN_SUBTITLES_API_KEY }}

    steps:
      - name: Checkout TARSVideo
        uses: actions/checkout@v4

      - name: Checkout Jellyfin Android
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-android
          ref: f6c4e51aafe7d372d2f275398303037176478456
          path: upstream

      - name: Checkout VLC Android
        uses: actions/checkout@v4
        with:
          repository: videolan/vlc-android
          ref: 4e773d5546c331a57aa67d3cb8103f701f944228
          path: vlc-android-source
          fetch-depth: 1

      - name: Prepare VLC source
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("vlc-android-source")

          settings = root / "settings.gradle"
          s = settings.read_text(encoding="utf-8")

          old = 'id("com.android.settings") version \'9.1.1\''
          new = 'id("com.android.settings") version \'9.4.0\''

          if old not in s:
              raise SystemExit(
                  "VLC settings.gradle AGP pattern not found"
              )

          s = s.replace(old, new, 1)

          old = "include ':libvlcjni:libvlc', ':medialibrary'"

          if old not in s:
              raise SystemExit(
                  "VLC libvlc include pattern not found"
              )

          settings.write_text(
              s.replace(
                  old,
                  "include ':medialibrary'",
                  1,
              ),
              encoding="utf-8",
          )

          top = root / "build.gradle"
          s = top.read_text(encoding="utf-8")

          old = "ext.android_plugin_version = '9.1.1'"

          if old not in s:
              raise SystemExit(
                  "VLC root AGP pattern not found"
              )

          top.write_text(
              s.replace(
                  old,
                  "ext.android_plugin_version = '9.4.0'",
                  1,
              ),
              encoding="utf-8",
          )

          patches = {
              "application/resources/build.gradle": [
                  (
                      "devApi project(':libvlcjni:libvlc')",
                      'devApi "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"',
                  ),
              ],
              "application/vlc-android/build.gradle": [
                  (
                      "devApi project(':libvlcjni:libvlc')",
                      'devApi "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"',
                  ),
              ],
              "medialibrary/build.gradle": [
                  (
                      "releaseImplementation project(':libvlcjni:libvlc')",
                      'releaseImplementation "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"',
                  ),
                  (
                      "devImplementation project(':libvlcjni:libvlc')",
                      'devImplementation "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"',
                  ),
              ],
          }

          for rel, replacements in patches.items():
              p = root / rel
              s = p.read_text(encoding="utf-8")

              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(
                          f"VLC dependency pattern not found in {rel}: {old}"
                      )

                  s = s.replace(
                      old,
                      new,
                      1,
                  )

              p.write_text(
                  s,
                  encoding="utf-8",
              )

          (root / "local.properties").touch()

          print("VLC source prepared")
          PY

      - name: Check OpenSubtitles API key
        run: |
          set -e

          if [ -z "$VLC_OPEN_SUBTITLES_API_KEY" ]; then
            echo "::error::Missing repository secret VLC_OPEN_SUBTITLES_API_KEY"
            exit 1
          fi

          echo "OpenSubtitles API key configured."

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply TARSVideo patches
        run: |
          set -e

          mkdir -p \
            upstream/app/src/main/res/drawable-nodpi \
            upstream/app/src/main/res/drawable-720dpi

          cp ./tars_icon.png \
            upstream/app/src/main/res/drawable-nodpi/tars_icon.png

          cp ./tars_icon.png \
            upstream/app/src/main/res/drawable-720dpi/tars_launcher_art.png

          python3 ./patch_tarsvideo.py upstream

          python3 - <<'PY'
          from pathlib import Path
          import re

          upstream = Path("upstream")
          vlc = Path("vlc-android-source")

          # ============================================================
          # Jellyfin Data Binding
          # ============================================================

          app_gradle = upstream / "app/build.gradle.kts"

          s = app_gradle.read_text(
              encoding="utf-8"
          )

          old = (
              "        viewBinding = true\n"
              "        compose = true"
          )

          new = (
              "        viewBinding = true\n"
              "        dataBinding = true\n"
              "        compose = true"
          )

          if old not in s:
              raise SystemExit(
                  "Jellyfin Data Binding anchor not found"
              )

          app_gradle.write_text(
              s.replace(
                  old,
                  new,
                  1,
              ),
              encoding="utf-8",
          )

          # ============================================================
          # Gradle memory
          # ============================================================

          gradle_props = upstream / "gradle.properties"

          s = gradle_props.read_text(
              encoding="utf-8"
          )

          if "org.gradle.jvmargs=-Xmx2048m" in s:
              s = s.replace(
                  "org.gradle.jvmargs=-Xmx2048m",
                  "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8",
                  1,
              )

          elif "org.gradle.jvmargs=" not in s:
              s += (
                  "\n"
                  "org.gradle.jvmargs=-Xmx4096m "
                  "-XX:MaxMetaspaceSize=768m "
                  "-Dfile.encoding=UTF-8\n"
              )

          if "org.gradle.workers.max=" not in s:
              s += "\norg.gradle.workers.max=2\n"

          if "kotlin.daemon.jvmargs=" not in s:
              s += (
                  "kotlin.daemon.jvmargs=-Xmx1024m\n"
              )

          gradle_props.write_text(
              s,
              encoding="utf-8",
          )

          # ============================================================
          # OpenSubtitles API key
          # ============================================================

          os_service = (
              vlc
              / "application/resources/src/main/java/"
                "org/videolan/resources/opensubtitles/"
                "OpenSubtitleService.kt"
          )

          s = os_service.read_text(
              encoding="utf-8"
          )

          old = (
              'fun getOSK() = '
              '"${BuildConfig.VLC_OPEN_SUBTITLES_API_KEY}'
              '${(-47).forbiddenChars()}Y"'
          )

          if old not in s:
              raise SystemExit(
                  "OpenSubtitles getOSK anchor not found"
              )

          s = s.replace(
              old,
              "fun getOSK() = "
              "BuildConfig.VLC_OPEN_SUBTITLES_API_KEY",
              1,
          )

          old = (
              '.header('
              '"Api-Key", '
              'getOSK().substrlng(55)'
              ')'
          )

          if old not in s:
              raise SystemExit(
                  "OpenSubtitles Api-Key header anchor not found"
              )

          s = s.replace(
              old,
              '.header("Api-Key", getOSK())',
              1,
          )

          os_service.write_text(
              s,
              encoding="utf-8",
          )

          # ============================================================
          # OpenSubtitles crash guard + HTTP diagnosis
          # ============================================================

          sub_dialog = (
              vlc
              / "application/vlc-android/src/"
                "org/videolan/vlc/gui/dialogs/"
                "SubtitleDownloaderDialogFragment.kt"
          )

          s = sub_dialog.read_text(
              encoding="utf-8"
          )

          import_anchor = (
              "import org.videolan.vlc.viewmodels."
              "SubtitlesModel\n"
          )

          if "import retrofit2.HttpException\n" not in s:
              if import_anchor not in s:
                  raise SystemExit(
                      "SubtitleDownloader import anchor not found"
                  )

              s = s.replace(
                  import_anchor,
                  import_anchor
                  + "import retrofit2.HttpException\n",
                  1,
              )

          download_pattern = re.compile(
              r"(?ms)^                "
              r"State\.NotDownloaded -> \{\n"
              r".*?"
              r"^                \}"
              r"(?=\n^                "
              r"State\.Downloaded ->)"
          )

          new_download = '''                State.NotDownloaded -> {
                    try {
                        withContext(Dispatchers.IO) {
                            Log.i(
                                "SubtitleDownload",
                                "Launching download for ${subtitleEvent.item.idSubtitle}"
                            )

                            val downloadLink =
                                OpenSubtitleRepository
                                    .getInstance()
                                    .getDownloadLink(
                                        subtitleEvent.item.fileId
                                    )

                            val openSubtitlesLimit =
                                OpenSubtitlesLimit(
                                    downloadLink.requests,
                                    downloadLink.requests +
                                        downloadLink.remaining,
                                    downloadLink.resetTimeUtc
                                )

                            OpenSubtitlesUtils.saveLimit(
                                settings,
                                openSubtitlesLimit
                            )

                            viewModel.observableLimit.set(
                                openSubtitlesLimit
                            )

                            subtitleEvent.item
                                .zipDownloadLink =
                                downloadLink.link

                            subtitleEvent.item.fileName =
                                downloadLink.fileName

                            subtitleEvent.item
                                .downloadError = false
                        }

                        VLCDownloadManager.download(
                            requireActivity(),
                            subtitleEvent.item,
                            true
                        )

                    } catch (e: Exception) {
                        Log.w(
                            "SubtitleDownload",
                            "OpenSubtitles download failed",
                            e
                        )

                        subtitleEvent.item
                            .downloadError = true

                        withContext(
                            Dispatchers.Main
                        ) {
                            val index =
                                downloadAdapter.dataset
                                    ?.indexOf(
                                        subtitleEvent.item
                                    )
                                    ?: -1

                            if (index >= 0) {
                                downloadAdapter
                                    .notifyItemChanged(
                                        index
                                    )
                            }

                            if (
                                ::toast.isInitialized
                            ) {
                                toast.cancel()
                            }

                            val http =
                                e as? HttpException

                            val errorBody =
                                if (http != null) {
                                    try {
                                        http.response()
                                            ?.errorBody()
                                            ?.string()
                                            ?.replace(
                                                "\\n",
                                                " "
                                            )
                                            ?.take(260)

                                    } catch (
                                        _: Exception
                                    ) {
                                        null
                                    }

                                } else {
                                    null
                                }

                            val detail =
                                when {
                                    http?.code() == 406 &&
                                        viewModel
                                            .observableUser
                                            .get()
                                            ?.logged != true -> {

                                        state =
                                            SubDownloadDialogState
                                                .Login

                                        "HTTP 406: download recusado ou limite atingido. Entre na sua conta do OpenSubtitles e tente novamente."
                                    }

                                    http?.code() == 406 -> {
                                        val reason =
                                            errorBody
                                                ?: "download recusado pelo OpenSubtitles"

                                        "HTTP 406: $reason"
                                    }

                                    http?.code() == 429 -> {
                                        "HTTP 429: limite temporário do OpenSubtitles. Aguarde e tente novamente."
                                    }

                                    http != null -> {
                                        val reason =
                                            errorBody
                                                ?: http.message()

                                        "HTTP ${http.code()}: $reason"
                                    }

                                    else -> {
                                        e.message
                                            ?.takeIf {
                                                it.isNotBlank()
                                            }
                                            ?: "Erro da API do OpenSubtitles"
                                    }
                                }

                            toast =
                                Toast.makeText(
                                    requireContext(),
                                    detail,
                                    Toast.LENGTH_LONG
                                )

                            toast.show()
                        }
                    }
                }'''

          # IMPORTANT:
          # use a lambda replacement so Python regex does NOT interpret
          # backslash sequences such as \n inside the Kotlin source.
          s, count = download_pattern.subn(
              lambda _match: new_download,
              s,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "SubtitleDownloader "
                  "NotDownloaded replacement "
                  f"failed: {count}"
              )

          sub_dialog.write_text(
              s,
              encoding="utf-8",
          )

          # ============================================================
          # Jellyfin -> VLC StartActivity
          # ============================================================

          ext = (
              upstream
              / "app/src/main/java/"
                "org/jellyfin/mobile/bridge/"
                "ExternalPlayer.kt"
          )

          s = ext.read_text(
              encoding="utf-8"
          )

          old = (
              "import org.videolan.vlc.gui.video."
              "VideoPlayerActivity"
          )

          if old not in s:
              raise SystemExit(
                  "ExternalPlayer VLC import not found"
              )

          s = s.replace(
              old,
              "import org.videolan.vlc.StartActivity",
              1,
          )

          old = "VideoPlayerActivity::class.java"

          if old not in s:
              raise SystemExit(
                  "ExternalPlayer VLC activity reference not found"
              )

          s = s.replace(
              old,
              "StartActivity::class.java",
              1,
          )

          # ============================================================
          # VLC playback tracking
          # ============================================================

          old = (
              "        when "
              "(val action = intent?.action) {"
          )

          if old not in s:
              raise SystemExit(
                  "ExternalPlayer result when anchor not found"
              )

          s = s.replace(
              old,
              "        val action = intent?.action\n"
              "        when {",
              1,
          )

          result_replacements = {
              (
                  "            "
                  "Constants.MPV_PLAYER_RESULT_ACTION "
                  "-> handleMPVPlayer(resultCode, intent)"
              ): (
                  "            "
                  "action == "
                  "Constants.MPV_PLAYER_RESULT_ACTION "
                  "-> handleMPVPlayer(resultCode, intent)"
              ),

              (
                  "            "
                  "Constants.MX_PLAYER_RESULT_ACTION "
                  "-> handleMXPlayer(resultCode, intent)"
              ): (
                  "            "
                  "action == "
                  "Constants.MX_PLAYER_RESULT_ACTION "
                  "-> handleMXPlayer(resultCode, intent)"
              ),

              (
                  "            "
                  "Constants.VLC_PLAYER_RESULT_ACTION "
                  "-> handleVLCPlayer(resultCode, intent)"
              ): (
                  "            "
                  "action == "
                  "Constants.VLC_PLAYER_RESULT_ACTION "
                  "|| action?.endsWith("
                  "\".player.result\""
                  ") == true "
                  "-> handleVLCPlayer(resultCode, intent)"
              ),

              (
                  "            "
                  "Constants.MPVKT_PLAYER_RESULT_ACTION "
                  "-> handleMPVKTPlayer(resultCode, intent)"
              ): (
                  "            "
                  "action == "
                  "Constants.MPVKT_PLAYER_RESULT_ACTION "
                  "-> handleMPVKTPlayer(resultCode, intent)"
              ),
          }

          for old, new in (
              result_replacements.items()
          ):
              if old not in s:
                  raise SystemExit(
                      "ExternalPlayer result "
                      f"branch not found: {old}"
                  )

              s = s.replace(
                  old,
                  new,
                  1,
              )

          # ============================================================
          # Authenticated Jellyfin external subtitles
          # ============================================================

          subtitle_handoff_pattern = re.compile(
              r'''(?ms)^            val externalSubs = source\.externalSubtitleStreams\n.*?^            if \(enabledSubUrl != null\) putExtra\("subtitles_location", enabledSubUrl\)$'''
          )

          subtitle_handoff = '''            val externalSubs = source.externalSubtitleStreams

            val tarsSubtitleQuery =
                apiClient.accessToken
                    ?.takeIf {
                        it.isNotBlank()
                    }
                    ?.let { token ->
                        mapOf(
                            ApiClient
                                .QUERY_ACCESS_TOKEN
                                to token
                        )
                    }
                    ?: emptyMap()

            val tarsExternalSubUrls =
                externalSubs.associate {
                    stream ->

                    stream.index to
                        apiClient.createUrl(
                            stream.deliveryUrl,
                            queryParameters =
                                tarsSubtitleQuery,
                        )
                }

            val enabledSubUrl =
                source.selectedSubtitleStream
                    ?.index
                    ?.let(
                        tarsExternalSubUrls::get
                    )

            val subtitleUris =
                externalSubs.mapNotNull {
                    stream ->

                    tarsExternalSubUrls[
                        stream.index
                    ]?.toUri()
                }

            putExtra(
                "subs",
                subtitleUris.toTypedArray()
            )

            putExtra(
                "subs.name",
                externalSubs.map(
                    ExternalSubtitleStream::
                        displayTitle
                ).toTypedArray()
            )

            putExtra(
                "subs.filename",
                externalSubs.map(
                    ExternalSubtitleStream::
                        language
                ).toTypedArray()
            )

            putExtra(
                "subs.enable",
                enabledSubUrl?.let {
                    url ->

                    arrayOf(
                        url.toUri()
                    )

                } ?: emptyArray()
            )

            if (
                enabledSubUrl != null
            ) {
                putExtra(
                    "subtitles_location",
                    enabledSubUrl
                )
            }'''

          s, count = (
              subtitle_handoff_pattern.subn(
                  lambda _match: subtitle_handoff,
                  s,
                  count=1,
              )
          )

          if count != 1:
              raise SystemExit(
                  "Jellyfin subtitle handoff "
                  "regex replacement failed: "
                  f"{count}"
              )

          ext.write_text(
              s,
              encoding="utf-8",
          )

          # ============================================================
          # VLC StartActivity: allow Jellyfin HTTP/HTTPS URLs
          # ============================================================

          start = (
              vlc
              / "application/vlc-android/src/"
                "org/videolan/vlc/"
                "StartActivity.kt"
          )

          s = start.read_text(
              encoding="utf-8"
          )

          old = (
              '        if ((intent.data != null '
              '&& intent.data!!.scheme == "content" '
              '&& FileUtils.getUri(intent.data) != null)'
          )

          new = '''        if (intent.data?.scheme == "http"
            || intent.data?.scheme == "https"
            || (intent.data != null && intent.data!!.scheme == "content" && FileUtils.getUri(intent.data) != null)'''

          if old not in s:
              raise SystemExit(
                  "VLC StartActivity "
                  "HTTP gate anchor not found"
              )

          start.write_text(
              s.replace(
                  old,
                  new,
                  1,
              ),
              encoding="utf-8",
          )

          # ============================================================
          # VLC: register all Jellyfin external subtitle tracks
          # ============================================================

          video_activity = (
              vlc
              / "application/vlc-android/src/"
                "org/videolan/vlc/gui/video/"
                "VideoPlayerActivity.kt"
          )

          s = video_activity.read_text(
              encoding="utf-8"
          )

          vlc_sub_pattern = re.compile(
              r'''(?m)^                subtitlesExtraPath = extras\.getString\(PLAY_EXTRA_SUBTITLES_LOCATION\)\n                if \(!subtitlesExtraPath\.isNullOrEmpty\(\)\) service\.addSubtitleTrack\(subtitlesExtraPath!!, true\)$'''
          )

          vlc_sub_replacement = '''                subtitlesExtraPath = extras.getString(PLAY_EXTRA_SUBTITLES_LOCATION)

                extras.getParcelableArray("subs")
                    ?.asSequence()
                    ?.mapNotNull {
                        it as? Uri
                    }
                    ?.filter {
                        it.toString() !=
                            subtitlesExtraPath
                    }
                    ?.distinct()
                    ?.forEach {
                        subtitleUri ->

                        service.addSubtitleTrack(
                            subtitleUri,
                            false
                        )
                    }

                if (
                    !subtitlesExtraPath
                        .isNullOrEmpty()
                ) {
                    service.addSubtitleTrack(
                        subtitlesExtraPath!!,
                        true
                    )
                }'''

          s, count = (
              vlc_sub_pattern.subn(
                  lambda _match: vlc_sub_replacement,
                  s,
                  count=1,
              )
          )

          if count != 1:
              raise SystemExit(
                  "VLC external subtitle "
                  "registration replacement "
                  f"failed: {count}"
              )

          video_activity.write_text(
              s,
              encoding="utf-8",
          )

          # ============================================================
          # VLC runtime initialization
          # ============================================================

          app = (
              upstream
              / "app/src/main/java/"
                "org/jellyfin/mobile/"
                "JellyfinApplication.kt"
          )

          s = app.read_text(
              encoding="utf-8"
          )

          import_anchor = (
              "import org.videolan.resources."
              "AppContextProvider\n"
          )

          extra_imports = (
              "import org.videolan.resources."
              "AppContextProvider\n"
              "import org.videolan.resources."
              "VLCInstance\n"
              "import org.videolan.tools.Settings\n"
              "import org.videolan.libvlc.Dialog\n"
              "import org.videolan.vlc.gui.helpers."
              "NotificationHelper\n"
              "import org.videolan.vlc.util."
              "DialogDelegate\n"
          )

          if (
              "import org.videolan.tools."
              "Settings\n"
              not in s
          ):
              if import_anchor not in s:
                  raise SystemExit(
                      "JellyfinApplication "
                      "import anchor not found"
                  )

              s = s.replace(
                  import_anchor,
                  extra_imports,
                  1,
              )

          factory_anchor = (
              "        "
              "FactoryManager.registerFactory("
              "ILibVLCFactory.factoryId, "
              "LibVLCFactory())\n"
          )

          runtime_init = (
              factory_anchor
              + "\n"
              + "        Settings.getInstance(this)\n"
              + "        Settings.initPostMigration(this)\n"
              + "        NotificationHelper."
                "createNotificationChannels(this)\n\n"
              + "        if (VLCInstance."
                "testCompatibleCPU(this)) {\n"
              + "            Dialog.setCallbacks("
                "VLCInstance.getInstance(this), "
                "DialogDelegate)\n"
              + "        }\n"
          )

          if (
              "Settings.getInstance(this)"
              not in s
          ):
              if factory_anchor not in s:
                  raise SystemExit(
                      "JellyfinApplication "
                      "factory anchor not found"
                  )

              s = s.replace(
                  factory_anchor,
                  runtime_init,
                  1,
              )

          app.write_text(
              s,
              encoding="utf-8",
          )

          # ============================================================
          # Remove VLC duplicate launcher icon
          # ============================================================

          manifest = (
              vlc
              / "application/vlc-android/"
                "AndroidManifest.xml"
          )

          s = manifest.read_text(
              encoding="utf-8"
          )

          activity_pos = s.find(
              'android:name=".StartActivity"'
          )

          if activity_pos == -1:
              raise SystemExit(
                  "VLC StartActivity "
                  "manifest entry not found"
              )

          filter_start = s.find(
              "<intent-filter>",
              activity_pos,
          )

          filter_end = s.find(
              "</intent-filter>",
              filter_start,
          )

          if (
              filter_start == -1
              or filter_end == -1
          ):
              raise SystemExit(
                  "VLC StartActivity "
                  "launcher filter not found"
              )

          filter_end += len(
              "</intent-filter>"
          )

          launcher = s[
              filter_start:filter_end
          ]

          if (
              "android.intent.action.MAIN"
              not in launcher
              or
              "android.intent.category.LAUNCHER"
              not in launcher
          ):
              raise SystemExit(
                  "First StartActivity "
                  "intent filter is not launcher"
              )

          manifest.write_text(
              s[:filter_start]
              + s[filter_end:],
              encoding="utf-8",
          )

          # ============================================================
          # Force embedded VLC player
          # ============================================================

          prefs = (
              upstream
              / "app/src/main/java/"
                "org/jellyfin/mobile/app/"
                "AppPreferences.kt"
          )

          s = prefs.read_text(
              encoding="utf-8"
          )

          s, count = re.subn(
              r'(@VideoPlayerType\s+'
              r'val videoPlayerType: String\s+'
              r'get\(\) = )[^\n]+',
              r'\1VideoPlayerType.EXTERNAL_PLAYER',
              s,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "AppPreferences "
                  "videoPlayerType "
                  "replacement failed"
              )

          prefs.write_text(
              s,
              encoding="utf-8",
          )

          # ============================================================
          # Player settings UI
          # ============================================================

          settings_file = (
              upstream
              / "app/src/main/java/"
                "org/jellyfin/mobile/settings/"
                "SettingsFragment.kt"
          )

          s = settings_file.read_text(
              encoding="utf-8"
          )

          begin = s.find(
              "        categoryHeader("
              "PREF_CATEGORY_VIDEO_PLAYER)"
          )

          end = s.find(
              "        val subtitleSettingsIntent",
              begin,
          )

          if (
              begin == -1
              or end == -1
          ):
              raise SystemExit(
                  "Settings video section "
                  "boundaries not found"
              )

          fixed_video = '''        categoryHeader(PREF_CATEGORY_VIDEO_PLAYER) {
              titleRes = R.string.pref_category_video_player
          }

          pref("tarsvideo_vlc_player") {
              title = "TARSVideo VLC"
              summary = "Player VLC integrado ao TARSVideo • Direct Play / Direct Stream"
          }
          '''

          settings_file.write_text(
              s[:begin]
              + fixed_video
              + s[end:],
              encoding="utf-8",
          )

          # ============================================================
          # Better Android launcher icon safe area
          # ============================================================

          foreground = (
              upstream
              / "app/src/main/res/drawable/"
                "tars_icon_foreground.xml"
          )

          foreground.write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
              android:drawable="@drawable/tars_launcher_art"
              android:insetLeft="24dp"
              android:insetTop="24dp"
              android:insetRight="24dp"
              android:insetBottom="24dp" />
          ''',
              encoding="utf-8",
          )

          adaptive = (
              upstream
              / "app/src/main/res/"
                "mipmap-anydpi-v26/"
                "tars_launcher.xml"
          )

          adaptive.write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/tars_launcher_background" />
              <foreground android:drawable="@drawable/tars_icon_foreground" />
          </adaptive-icon>
          ''',
              encoding="utf-8",
          )

          legacy = (
              upstream
              / "app/src/main/res/"
                "mipmap-anydpi/"
                "tars_launcher.xml"
          )

          legacy.write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/tars_launcher_background" />
              <item android:drawable="@drawable/tars_icon_foreground" />
          </layer-list>
          ''',
              encoding="utf-8",
          )

          styles = (
              upstream
              / "app/src/main/res/values/"
                "styles.xml"
          )

          s = (
              styles.read_text(
                  encoding="utf-8"
              )
              .replace(
                  "@drawable/tars_icon_padded",
                  "@drawable/tars_icon_foreground",
              )
          )

          styles.write_text(
              s,
              encoding="utf-8",
          )

          web_layout = (
              upstream
              / "app/src/main/res/layout/"
                "fragment_webview.xml"
          )

          s = (
              web_layout.read_text(
                  encoding="utf-8"
              )
              .replace(
                  "@drawable/tars_icon_padded",
                  "@drawable/tars_icon_foreground",
              )
          )

          web_layout.write_text(
              s,
              encoding="utf-8",
          )

          print(
              "TARSVideo v0.3.4.9.2 "
              "patches applied"
          )
          PY

      - name: Resolve Jellyfin VLC manifest conflicts
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "upstream/app/src/main/"
              "AndroidManifest.xml"
          )

          s = manifest.read_text(
              encoding="utf-8"
          )

          for target in (
              'android:name="com.google.android.gms.car.notification.SmallIcon"',
              'android:name="androidx.car.app.TintableAttributionIcon"',
          ):
              pos = s.find(target)

              if pos == -1:
                  raise SystemExit(
                      "Manifest metadata "
                      f"not found: {target}"
                  )

              end = s.find(
                  "/>",
                  pos,
              )

              if end == -1:
                  raise SystemExit(
                      "Manifest metadata "
                      f"end not found: {target}"
                  )

              block = s[pos:end]

              if (
                  'tools:replace="android:resource"'
                  not in block
              ):
                  s = (
                      s[:end]
                      + '\n            '
                        'tools:replace="android:resource"'
                      + s[end:]
                  )

          manifest.write_text(
              s,
              encoding="utf-8",
          )

          print(
              "Manifest conflicts resolved"
          )
          PY

      - name: Verify embedded VLC dependency
        working-directory: upstream
        run: |
          set -e
          chmod +x gradlew

          ./gradlew \
            :app:dependencies \
            --configuration libreDebugRuntimeClasspath \
            --max-workers=2 \
            > ../vlc-deps.txt

          grep -n \
            "org.videolan.tars:vlc-android\|libvlc-all\|medialibrary-all" \
            ../vlc-deps.txt \
            | head -80 \
            || true

          if grep -q \
            "org.videolan.tars:vlc-android:3.7.1 FAILED" \
            ../vlc-deps.txt
          then
            echo "ERROR: embedded VLC project substitution failed"
            exit 1
          fi

      - name: Build APK
        working-directory: upstream
        run: |
          set -e
          chmod +x gradlew

          ./gradlew \
            assembleLibreDebug \
            --max-workers=2 \
            --stacktrace

      - name: Collect APK
        run: |
          set -e

          mkdir -p dist

          APK="$(
            find upstream/app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "No APK found"
            exit 1
          fi

          cp "$APK" \
            dist/TARSVideo-v0.3.4.9.2-VLC-debug.apk

          ls -lh \
            dist/TARSVideo-v0.3.4.9.2-VLC-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TARSVideo-Android-v0.3.4.9.2-VLC
          path: dist/TARSVideo-v0.3.4.9.2-VLC-debug.apk
          retention-days: 14
          if-no-files-found: error
