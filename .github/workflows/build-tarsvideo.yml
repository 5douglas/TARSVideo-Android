name: Build TARSVideo Android v0.4.0 Native + TARS Chat

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout TARSVideo
        uses: actions/checkout@v4

      - name: Checkout Jellyfin Android
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-android
          ref: f6c4e51aafe7d372d2f275398303037176478456
          path: upstream

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply TARSVideo v0.4 patches
        run: |
          set -e

          python3 -m py_compile patch_tarsvideo.py

          mkdir -p             upstream/app/src/main/res/drawable-nodpi             upstream/app/src/main/res/drawable-720dpi

          cp ./tars_icon.png             upstream/app/src/main/res/drawable-nodpi/tars_icon.png

          cp ./tars_icon.png             upstream/app/src/main/res/drawable-720dpi/tars_launcher_art.png

          python3 ./patch_tarsvideo.py upstream

      - name: Verify native player and JavaScript Injector compatibility
        run: |
          set -e

          echo "===== TARSVideo v0.4 preflight ====="

          grep -n             'applicationId = "br.seg.douglas.tarsvideo"'             upstream/app/build.gradle.kts

          grep -n             'javaScriptEnabled = true'             upstream/app/src/main/java/org/jellyfin/mobile/utils/WebViewUtils.kt

          grep -n             'domStorageEnabled = true'             upstream/app/src/main/java/org/jellyfin/mobile/utils/WebViewUtils.kt

          grep -n             'JavaScript Injector scripts'             upstream/app/src/main/java/org/jellyfin/mobile/webapp/WebViewFragment.kt

          grep -n             'tarsvideo_native_player_v040'             upstream/app/src/main/java/org/jellyfin/mobile/JellyfinApplication.kt

          # Jellyfin official contains normal VLC external-player references.
          # Only fail if old embedded-VLC dependencies are present.
          if grep -n -E             'org\.videolan\.tars:vlc-android|vlc-android-source|libvlc-all|medialibrary-all'             upstream/app/build.gradle.kts             upstream/settings.gradle.kts
          then
            echo "ERROR: stale embedded VLC dependency detected"
            exit 1
          fi

          echo "PLAYER=JELLYFIN_NATIVE_EXOPLAYER"
          echo "JAVASCRIPT_INJECTOR_COMPAT=YES"
          echo "TARS_CHAT_WEBVIEW_READY=YES"

      - name: Build APK
        working-directory: upstream
        run: |
          set -e
          chmod +x gradlew

          ./gradlew             assembleLibreDebug             --max-workers=2             --stacktrace

      - name: Collect APK
        run: |
          set -e

          mkdir -p dist

          APK="$(
            find upstream/app/build/outputs/apk/libre/debug               -type f               -name '*.apk'               | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "No APK found"
            exit 1
          fi

          cp "$APK"             dist/TARSVideo-v0.4.0-native-debug.apk

          (
            cd dist
            sha256sum               TARSVideo-v0.4.0-native-debug.apk               > TARSVideo-v0.4.0-native-debug.apk.sha256
          )

          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TARSVideo-Android-v0.4.0-Native-TARSChat
          path: |
            dist/TARSVideo-v0.4.0-native-debug.apk
            dist/TARSVideo-v0.4.0-native-debug.apk.sha256
          retention-days: 14
          if-no-files-found: error
